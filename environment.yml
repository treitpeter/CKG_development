# CKG Modern Environment
# Usage: conda env create -f environment.yml
# Then: conda activate ckg2026

name: ckg2026
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip>=23.0

  # Core scientific stack
  - pandas>=2.1
  - numpy>=1.26,<2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - statsmodels>=0.14

  # Visualization
  - matplotlib>=3.8
  - plotly>=5.18

  # Network analysis
  - networkx>=3.2

  # Data formats
  - h5py>=3.10
  - pytables>=3.9
  - openpyxl>=3.1
  - xlrd>=2.0
  - pyyaml>=6.0
  - lxml>=4.9

  # Jupyter
  - jupyter
  - ipykernel

  # Other
  - requests>=2.31
  - beautifulsoup4>=4.12
  - tqdm
  - psutil

  # Install the same package/dependency set as pip and install.sh.
  - pip:
    - -e .
